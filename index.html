<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>픽셀 대통령 백과</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.39.3/dist/galmuri.css">
<style>
:root{
  --bg:#1b1640; --bg2:#2a2160; --panel:#fdf6e3; --ink:#1b1640; --muted:#6b5f8a;
  --accent:#ff5d8f; --accent2:#ffd23f; --accent3:#3ee0c5; --line:#1b1640;
  --shadow:#0e0b24;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  background-image:
    radial-gradient(#ffffff22 1px, transparent 1px),
    radial-gradient(#ffffff11 1px, transparent 1px);
  background-size:24px 24px, 13px 13px;
  background-position:0 0, 6px 9px;
  color:var(--panel);
  font-family:'Galmuri11','Galmuri9','DungGeunMo',monospace;
  min-height:100vh; overflow-x:hidden;
}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 64px}
header{text-align:center;margin:12px 0 28px}
.logo{
  display:inline-block;font-family:'Galmuri14','Galmuri11',monospace;
  font-size:clamp(26px,5vw,46px);letter-spacing:2px;color:var(--accent2);
  text-shadow:4px 4px 0 var(--accent),8px 8px 0 var(--shadow);
  animation:logoBob 2.4s steps(4) infinite;
}
@keyframes logoBob{50%{transform:translateY(-4px)}}
.sub{margin-top:14px;color:#cfc6ff;font-size:14px}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* pixel box */
.px{
  background:var(--panel);color:var(--ink);
  border:4px solid var(--line);
  box-shadow:0 0 0 4px var(--panel),0 0 0 8px var(--line),8px 8px 0 8px var(--shadow);
  margin:8px;
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px}
.card{position:relative;padding:14px;cursor:pointer;transition:transform .12s steps(2)}
.card:hover{transform:translate(-3px,-3px)}
.card:focus-visible{outline:4px dashed var(--accent);outline-offset:10px}
.badge{
  position:absolute;top:-14px;left:12px;background:var(--accent);color:#fff;
  border:3px solid var(--line);padding:2px 8px;font-size:12px
}
.badge.now{background:var(--accent3);color:var(--ink)}
.stage{
  height:170px;border:4px solid var(--line);position:relative;overflow:hidden;
  image-rendering:pixelated;
}
.stage .ground{position:absolute;left:0;right:0;bottom:0;height:22px;background:repeating-linear-gradient(90deg,#5bbf4a 0 8px,#4aa83c 8px 16px);border-top:4px solid var(--line)}
.stage svg.scene{position:absolute;left:50%;bottom:14px;width:240px;height:160px;margin-left:-120px;image-rendering:pixelated;shape-rendering:crispEdges;overflow:visible}
.cloud{position:absolute;top:18px;width:36px;height:12px;background:#fff;box-shadow:8px -8px 0 #fff,16px 0 0 #fff;opacity:.9;animation:cloud 18s linear infinite}
@keyframes cloud{from{left:-60px}to{left:110%}}
.name{font-family:'Galmuri14','Galmuri11',monospace;font-size:24px;margin:12px 0 2px}
.meta{font-size:12px;color:var(--muted)}
.move{margin-top:8px;font-size:12px;background:#ffe9a8;border:3px solid var(--line);padding:6px 8px}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{
  font:inherit;font-size:13px;cursor:pointer;border:3px solid var(--line);
  background:var(--accent2);color:var(--ink);padding:8px 12px;
  box-shadow:4px 4px 0 var(--line);
}
.btn:active{transform:translate(4px,4px);box-shadow:none}
.btn.voice{background:var(--accent);color:#fff}
.btn.voice.playing{background:var(--accent3);color:var(--ink)}
.btn.voice.playing::after{content:' ■'}

/* modal */
.modal{position:fixed;inset:0;background:#0e0b24cc;display:none;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:20}
.modal.open{display:flex}
.sheet{width:min(980px,100%);padding:20px;position:relative;animation:pop .25s steps(3)}
@keyframes pop{from{transform:scale(.8)}to{transform:scale(1)}}
.close{position:absolute;top:10px;right:10px}
.detail{display:grid;grid-template-columns:240px 1fr;gap:20px}
@media (max-width:720px){.detail{grid-template-columns:1fr}}
.photoBox{max-width:260px;margin:0 auto;border:4px solid var(--line);background:#222;aspect-ratio:3/4;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.photoBox canvas,.photoBox img{width:100%;height:100%;image-rendering:pixelated;object-fit:cover}
.photoBox .cap{position:absolute;bottom:0;left:0;right:0;background:#1b1640dd;color:#fff;font-size:10px;padding:3px 6px}
.photoBox .scan{position:absolute;inset:0;background:repeating-linear-gradient(#0000 0 3px,#0002 3px 4px);pointer-events:none}
.pxToggle{margin-top:8px;width:100%}
h3{font-family:'Galmuri14','Galmuri11',monospace;margin:18px 0 8px;font-size:16px;display:flex;align-items:center;gap:8px}
h3::before{content:'';width:10px;height:10px;background:var(--accent);box-shadow:2px 2px 0 var(--line)}
ul.pix{list-style:none;padding:0;margin:0}
ul.pix li{padding:6px 0 6px 20px;position:relative;font-size:14px;line-height:1.5;border-bottom:2px dashed #d9cfb0}
ul.pix li::before{content:'▶';position:absolute;left:0;color:var(--accent);font-size:11px;top:8px}
.info{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.info dt{color:var(--muted)}.info dd{margin:0}
.summary{font-size:14px;line-height:1.7}
.bubble{position:relative;background:#fff;border:3px solid var(--line);padding:10px 12px;font-size:13px;line-height:1.6;margin-top:12px;min-height:46px}
.bubble::after{content:'';position:absolute;left:30px;top:-12px;border:6px solid transparent;border-bottom-color:var(--line)}
.timeline{display:flex;gap:4px;margin:6px 0 30px;overflow-x:auto;padding:8px 4px}
.tl{flex:1;min-width:92px;text-align:center;font-size:11px;color:#cfc6ff;cursor:pointer;border:3px solid transparent;padding:6px 2px}
.tl:hover{border-color:var(--accent2)}
.tl b{display:block;color:var(--accent2);font-size:13px}
footer{text-align:center;color:#9d93d6;font-size:11px;margin-top:40px;line-height:1.8}

/* ===== sprite animations ===== */
.scene .armR,.scene .armL,.scene .head,.scene .char,.scene .wheel,.scene .dog,.scene .prop{transform-box:fill-box}
.scene .armR{transform-origin:50% 0}
.scene .armL{transform-origin:50% 0}
.scene .head{transform-origin:50% 100%}
.scene .wheel{transform-origin:50% 50%}
.talking .scene .head{animation:talk .3s steps(2) infinite}
@keyframes talk{50%{transform:translateY(-1px)}}

/* bike (노무현) */
.m-bike .rider{animation:ride 4s steps(16) infinite alternate}
.m-bike .wheel{animation:spin .4s steps(4) infinite}
.m-bike .head{animation:nod 1s steps(2) infinite}
@keyframes ride{from{transform:translateX(-12px)}to{transform:translateX(14px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes nod{50%{transform:rotate(4deg)}}

/* bulldozer (이명박) */
.m-dozer .rider{animation:push 2.4s steps(8) infinite}
.m-dozer .armR{animation:thumb 1.2s steps(2) infinite}
@keyframes push{0%{transform:translateX(-8px)}50%{transform:translateX(2px)}100%{transform:translateX(-8px)}}
@keyframes thumb{50%{transform:rotate(-150deg)}}

/* wave (박근혜) */
.m-wave .armR{animation:wave .8s steps(3) infinite alternate}
.m-wave .char{animation:sway 2s steps(4) infinite alternate}
@keyframes wave{from{transform:rotate(-140deg)}to{transform:rotate(-190deg)}}
@keyframes sway{from{transform:translateX(-3px)}to{transform:translateX(3px)}}

/* walk dog (문재인) */
.m-dog .rider{animation:walkx 6s steps(24) infinite alternate}
.m-dog .char{animation:bob .5s steps(2) infinite}
.m-dog .dog{animation:hop .35s steps(2) infinite}
.m-dog .armL{animation:leash 1s steps(2) infinite}
@keyframes walkx{from{transform:translateX(-4px)}to{transform:translateX(12px)}}
@keyframes bob{50%{transform:translateY(-2px)}}
@keyframes hop{50%{transform:translateY(-3px)}}
@keyframes leash{50%{transform:rotate(15deg)}}

/* sing (윤석열) */
.m-sing .char{animation:sway 1s steps(2) infinite alternate}
.m-sing .head{animation:nod .5s steps(2) infinite}
.m-sing .note{animation:noteUp 2.4s steps(8) infinite;opacity:0}
.m-sing .note:nth-of-type(2){animation-delay:.8s}
.m-sing .note:nth-of-type(3){animation-delay:1.6s}
@keyframes noteUp{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(10px,-30px)}}

/* fist (이재명) */
.m-fist .armR{animation:cheers 1.6s steps(4) infinite}
.m-fist .char{animation:bob .8s steps(2) infinite}
.m-fist .bubble-p{animation:fizz 1.6s steps(6) infinite;opacity:0}
.m-fist .bubble-p:nth-of-type(2){animation-delay:.5s}
.m-fist .bubble-p:nth-of-type(3){animation-delay:1s}
@keyframes cheers{0%,100%{transform:rotate(-160deg)}50%{transform:rotate(-200deg)}}
@keyframes fizz{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-22px)}}

.scene .hat,.scene .flame,.scene .dovebird{transform-box:fill-box;transform-origin:50% 100%}
/* hat tip (이승만) */
.m-hattip .hat{animation:hatUp 2.4s steps(1) infinite}
.m-hattip .armR{animation:hatArm 2.4s steps(1) infinite}
.m-hattip .char{animation:bowSm 2.4s steps(1) infinite}
@keyframes hatUp{0%,45%{transform:none}50%,90%{transform:translateY(-5px)}}
@keyframes hatArm{0%,45%{transform:none}50%,90%{transform:rotate(155deg)}}
@keyframes bowSm{0%,45%{transform:none}50%,90%{transform:translateY(1px)}}
/* tea (윤보선) */
.m-tea .armR{animation:sip 3s steps(3) infinite}
@keyframes sip{0%,30%{transform:rotate(30deg)}50%,80%{transform:rotate(150deg)}100%{transform:rotate(30deg)}}
/* flag (박정희) */
.m-flag .armR{animation:wave .6s steps(2) infinite alternate}
.m-flag .char{animation:bob .6s steps(2) infinite}
/* fan (최규하) */
.m-fan .armR{animation:fanning .5s steps(2) infinite alternate}
@keyframes fanning{from{transform:rotate(100deg)}to{transform:rotate(135deg)}}
/* golf (전두환) */
.m-golf .armR{animation:swing 2s steps(5) infinite}
@keyframes swing{0%{transform:rotate(-40deg)}40%{transform:rotate(160deg)}60%{transform:rotate(-170deg)}100%{transform:rotate(-40deg)}}
/* torch (노태우) */
.m-torch .armR{transform:rotate(-175deg)}
.m-torch .flame{animation:flick .25s steps(2) infinite}
.m-torch .char{animation:bob .3s steps(2) infinite}
.m-torch .rider{animation:walkx 3s steps(12) infinite alternate}
@keyframes flick{50%{transform:scaleY(1.3)}}
/* jog (김영삼) */
.m-jog .rider{animation:walkx 2.4s steps(12) infinite alternate}
.m-jog .char{animation:bob .25s steps(2) infinite}
.m-jog .armR{animation:jogA .5s steps(2) infinite alternate}
.m-jog .armL{animation:jogA .5s steps(2) infinite alternate-reverse}
@keyframes jogA{from{transform:rotate(-35deg)}to{transform:rotate(35deg)}}
/* dove (김대중) */
.m-dove .armR{animation:cheerR 1s steps(2) infinite alternate}
.m-dove .armL{animation:cheerL 1s steps(2) infinite alternate}
.m-dove .dovebird{animation:fly 3s steps(12) infinite}
@keyframes cheerR{from{transform:rotate(-150deg)}to{transform:rotate(-175deg)}}
@keyframes cheerL{from{transform:rotate(150deg)}to{transform:rotate(175deg)}}
@keyframes fly{0%{transform:translate(4px,6px);opacity:1}100%{transform:translate(26px,-14px);opacity:0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">★ 픽셀 대통령 백과 ★</div>
    <div class="sub">제1대 이승만 ~ 제21대 이재명 · 14명의 대통령 · 카드를 눌러 자세히 보기 <span class="blink">▮</span></div>
  </header>

  <div class="timeline" id="timeline"></div>
  <main class="grid" id="grid"></main>

  <footer>
    사진: 위키백과/위키미디어 공용 (실시간 불러오기, 픽셀 필터 적용) · 캐릭터는 직접 그린 픽셀 일러스트<br>
    🔊 음성 해설은 브라우저 내장 TTS로 대통령별 톤을 달리한 <b>해설자 음성</b>이에요 (실제 본인 목소리 아님)<br>
    콘텐츠는 멀티 에이전트 워크플로우(작성 → 사실·중립성 검수)로 만들었어요. 2026년 11월 기준.
  </footer>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="sheet px" id="sheet"></div>
</div>

    case 'bald': return R(2,5,1,3,c)+R(13,5,1,3,c)+R(3,4,1,2,c)+R(12,4,1,2,c);
    default: return R(2,2,12,3,c)+R(2,5,2,3,c)+R(12,5,2,2,c)+R(3,5,6,1,c);
  }
}
function head(L){
  let s = R(3,2,10,1,K)+R(2,3,12,10,K)+R(3,13,10,1,K)+R(3,3,10,10,L.skin);
  s += hair(L);
  s += R(5,8,1,2,K)+R(10,8,1,2,K)+R(4,10,2,1,'#ff9aa8')+R(10,10,2,1,'#ff9aa8')+R(7,11,2,1,'#b0414f');
  if(L.acc==='glasses'){ const K='#7a6a9a'; s+=R(4,7,3,1,K)+R(4,9,3,1,K)+R(4,7,1,3,K)+R(6,7,1,3,K)+R(9,7,3,1,K)+R(9,9,3,1,K)+R(9,7,1,3,K)+R(11,7,1,3,K)+R(7,8,2,1,K); }
  if(L.acc==='shades'){ s+=R(4,8,3,2,K)+R(9,8,3,2,K)+R(7,8,2,1,K)+R(4,8,1,1,'#666')+R(9,8,1,1,'#666'); }
  if(L.acc==='fedora'){ s+=`<g class="hat">${R(1,2,14,1,'#3b3b3b')+R(3,-2,10,4,'#3b3b3b')+R(3,0,10,1,'#8b1e2d')}</g>`; }
  if(L.acc==='straw'){ s+=R(0,3,16,2,'#e8c25a')+R(3,0,10,3,'#f2d27a')+R(3,2,10,1,'#c0392b'); }
  if(L.acc==='hardhat'){ s+=R(2,0,12,4,'#ffcc00')+R(1,4,14,1,'#e6a800')+R(7,0,2,4,'#e6a800'); }
  return `<g class="head">${s}</g>`;
}
function body(L){
  let s = R(3,14,10,8,K)+R(4,14,8,7,L.suit);
  if(L.tie){ s+=R(6,14,4,2,'#fff')+R(7,14,2,5,L.tie); } else { s+=R(6,14,4,2,'#fff')+R(5,17,6,1,'#8f2433'); }
  s += R(4,22,3,3,'#2b2b3a')+R(9,22,3,3,'#2b2b3a')+R(3,25,4,1,K)+R(9,25,4,1,K);
  return s;
}
function arm(L,cls,x,item=''){
  return `<g class="${cls}">${R(x,15,3,6,K)+R(x+1,15,1,5,L.suit)+R(x,21,3,2,L.skin)}${item}</g>`;
}
function character(L){
  let rItem='';
  if(L.acc==='mic') rItem = R(13,23,3,3,'#555')+R(14,26,1,4,'#222');
  if(L.move==='tea') rItem = R(12,22,4,3,'#fff')+R(12,22,4,1,'#a0522d')+R(16,23,1,1,'#fff')+R(11,25,6,1,'#ddd');
  if(L.move==='flag') rItem = R(14,21,1,11,'#8b5a2b')+R(15,26,7,5,'#3a8f3a')+R(17,27,3,3,'#ffd23f');
  if(L.move==='fan') rItem = R(11,23,6,5,'#f5e6c8')+R(11,23,6,1,K)+R(13,24,1,4,'#c9a227')+R(14,28,1,2,'#8b5a2b');
  if(L.move==='golf') rItem = R(14,22,1,9,'#aaa')+R(14,31,3,1,'#333');
  if(L.move==='torch') rItem = R(14,22,1,6,'#c9a227')+`<g class="flame">${R(13,28,3,3,'#ff8c00')+R(14,30,1,2,'#ffd23f')}</g>`;
  const armRx = 13;
  return `<g class="char">${arm(L,'armL',0)}${body(L)}${head(L)}${arm(L,'armR',armRx,rItem)}</g>`;
}
function bike(){
  const wheel=(cx)=>`<g class="wheel">${R(cx-4,30,8,1,K)+R(cx-4,37,8,1,K)+R(cx-5,31,1,6,K)+R(cx+4,31,1,6,K)+R(cx-1,31,1,6,'#777')+R(cx-4,33,8,1,'#777')}</g>`;
  return wheel(-2)+wheel(20)+R(-2,27,22,2,'#d64545')+R(8,22,2,6,'#d64545')+R(5,22,6,1,K)+R(18,20,2,8,'#d64545')+R(17,19,4,1,K);
}
function dozer(){return `<g class="prop" transform="translate(20,14)">${R(0,4,14,8,'#ffcc00')+R(0,4,14,1,K)+R(2,0,6,4,'#e6a800')+R(3,1,4,2,'#9fd8ff')+R(-4,2,3,12,'#888')+R(0,12,14,3,K)+R(1,13,2,1,'#777')+R(6,13,2,1,'#777')+R(11,13,2,1,'#777')}</g>`}
function dog(){return `<g class="dog" transform="translate(-22,16)">${R(0,2,10,5,'#222')+R(8,0,4,4,'#222')+R(10,1,1,1,'#fff')+R(12,2,1,1,'#ff9aa8')+R(0,7,2,3,'#222')+R(7,7,2,3,'#222')+R(-2,1,2,2,'#222')+R(5,3,3,2,'#d64545')}</g>`+R(-10,18,10,1,'#d64545')}
function notes(){return `<g transform="translate(18,0)"><text class="note" x="0" y="8" font-size="7" fill="#ff5d8f">♪</text><text class="note" x="4" y="10" font-size="7" fill="#3a6df0">♫</text><text class="note" x="-2" y="6" font-size="7" fill="#ff8c00">♪</text></g>`}
function fizz(){return `<g transform="translate(14,-2)">${R(0,0,1,1,'#bff')}</g><g>${R(26,8,1,1,'#7fe')}</g>`.replace(/<rect/g,'<rect class="bubble-p"')+`<g>${R(28,12,1,1,'#7fe','bubble-p')}${R(27,6,1,1,'#bff','bubble-p')}${R(29,10,1,1,'#fff','bubble-p')}</g>`}

function sceneSVG(id){
  const L=LOOK[id];
  let inner = character(L), extra='', riderY=4;
  if(L.move==='bike'){ inner = `<g transform="translate(0,-3)">${character(L)}</g>`+bike(); riderY=0; }
  if(L.move==='dozer') extra = dozer();
  if(L.move==='dog') extra = dog();
  if(L.move==='sing') extra = notes();
  if(L.move==='dove') extra = `<g class="dovebird">${R(0,2,5,2,'#fff')+R(1,0,2,2,'#fff')+R(4,1,2,1,'#fff')+R(5,2,1,1,'#ffb000')+R(4,1,1,1,K)+R(-1,3,2,1,'#ddd')}</g>`;
  if(L.move==='golf') extra = R(28,24,2,2,'#fff');
  if(L.move==='fist') extra = fizz()+`<text class="bubble-p" x="18" y="2" font-size="5" fill="#d64545">일 하자!</text>`;
  // viewBox 60x40, character is 16x26 at center
  return `<svg class="scene" viewBox="-22 -6 60 40" aria-hidden="true"><g class="rider" transform="translate(0,${riderY})">${inner}${extra}</g></svg>`;
}

/* ---------- photo pixelator (Wikipedia REST, CORS ok) ---------- */
const photoCache={};
async function getPhotoURL(id){
  if(photoCache[id]) return photoCache[id];
  const r = await fetch('https://ko.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(LOOK[id].wiki));
  const j = await r.json();
  const url = (j.originalimage||j.thumbnail||{}).source;
  if(!url) throw new Error('no image');
  return photoCache[id]=url.replace(/\/\d+px-/, '/320px-');
}
function pixelate(img, canvas, block){
  const W=Math.round(240/block), H=Math.round(320/block);
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext('2d');
  const ir=img.naturalWidth/img.naturalHeight, cr=W/H;
  let sw,sh,sx,sy;
  if(ir>cr){sh=img.naturalHeight;sw=sh*cr;sx=(img.naturalWidth-sw)/2;sy=0}else{sw=img.naturalWidth;sh=sw/cr;sx=0;sy=0}
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(img,sx,sy,sw,sh,0,0,W,H);
  try{
    const d=ctx.getImageData(0,0,W,H),p=d.data,q=36;
    for(let i=0;i<p.length;i+=4){p[i]=Math.round(p[i]/q)*q;p[i+1]=Math.round(p[i+1]/q)*q;p[i+2]=Math.round(p[i+2]/q)*q}
    ctx.putImageData(d,0,0);
  }catch(e){}
}
async function loadPhoto(id, box){
  box.innerHTML='<div style="color:#fff;font-size:12px" class="blink">사진 로딩중...</div>';
  try{
    const url=await getPhotoURL(id);
    const img=new Image(); img.crossOrigin='anonymous'; img.src=url;
    await img.decode();
    const c=document.createElement('canvas');
    let block=6; pixelate(img,c,block);
    box.innerHTML=''; box.appendChild(c);
    box.insertAdjacentHTML('beforeend','<div class="scan"></div><div class="cap">📷 위키미디어 공용</div>');
    const t=document.getElementById('pxToggle');
    if(t){t.onclick=()=>{block=block===6?3:block===3?1:6;pixelate(img,c,block);t.textContent='픽셀 크기: '+(block===1?'원본':block===3?'작게':'크게')}}
  }catch(e){
    box.innerHTML=`<div style="color:#fff;font-size:12px;padding:12px;text-align:center">사진을 불러오지 못했어요<br>(인터넷 연결 확인)</div>`;
  }
}

/* ---------- voice (Web Speech TTS) ---------- */
let current=null;
function koVoice(){const v=speechSynthesis.getVoices();return v.find(x=>/ko/i.test(x.lang)&&/Google|Neural|Natural/i.test(x.name))||v.find(x=>/ko/i.test(x.lang))}
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged=()=>{};
function stopVoice(){
  if('speechSynthesis' in window) speechSynthesis.cancel();
  document.querySelectorAll('.btn.voice.playing').forEach(b=>{b.classList.remove('playing');b.textContent='🔊 목소리로 듣기'});
  document.querySelectorAll('.talking').forEach(e=>e.classList.remove('talking'));
  current=null;
}
function speak(id, btn){
  if(!('speechSynthesis' in window)){alert('이 브라우저는 음성 재생을 지원하지 않아요');return}
  if(current===id){stopVoice();return}
  stopVoice();
  const P=DATA[id], L=LOOK[id];
  const u=new SpeechSynthesisUtterance(P.narration);
  u.lang='ko-KR'; const v=koVoice(); if(v) u.voice=v;
  u.pitch=L.voice.pitch; u.rate=L.voice.rate;
  current=id;
  document.querySelectorAll(`[data-voice="${id}"]`).forEach(b=>{b.classList.add('playing');b.textContent='🔊 재생 중'});
  document.querySelectorAll(`[data-stage="${id}"]`).forEach(s=>s.classList.add('talking'));
  const bub=document.getElementById('bubble-'+id);
  u.onboundary=(e)=>{ if(bub) bub.innerHTML='<b>'+P.narration.slice(0,e.charIndex)+'</b>'+P.narration.slice(e.charIndex) };
  u.onend=u.onerror=()=>{ if(current===id) stopVoice(); if(bub) bub.textContent=P.narration };
  speechSynthesis.speak(u);
}

/* ---------- render ---------- */
const DATA = Object.fromEntries((window.PRESIDENTS||[]).map(p=>[p.id,p]));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function stage(id){
  const L=LOOK[id];
  return `<div class="stage m-${L.move}" data-stage="${id}" style="background:${L.bg}"><div class="cloud"></div><div class="cloud" style="animation-delay:-9s;top:44px"></div>${sceneSVG(id)}<div class="ground"></div></div>`;
}
function card(id){
  const P=DATA[id], L=LOOK[id]; if(!P) return '';
  const now = id==='ljm';
  return `<article class="card px" tabindex="0" data-id="${id}">
    <span class="badge ${now?'now':''}">${esc(P.order)}${now?' · 현직':''}</span>
    ${stage(id)}
    <div class="name">${esc(P.name)} <small style="font-size:14px;color:var(--muted)">${esc(P.hanja)}</small></div>
    <div class="meta">${esc(P.term)} · ${esc(P.party)}</div>
    <div class="move">✨ 시그니처: ${esc(L.moveLabel)}</div>
    <div class="row">
      <button class="btn voice" data-voice="${id}">🔊 목소리로 듣기</button>
      <button class="btn more">📖 자세히</button>
    </div>
  </article>`;
}
function detail(id){
  const P=DATA[id], L=LOOK[id];
  return `<button class="btn close" aria-label="닫기">✕</button>
  <div class="detail">
    <div>
      <div class="photoBox" id="photoBox"></div>
      <button class="btn pxToggle" id="pxToggle">픽셀 크기: 크게</button>
      <div style="margin-top:14px">${stage(id)}</div>
    </div>
    <div>
      <span class="badge ${id==='ljm'?'now':''}" style="position:static;display:inline-block">${esc(P.order)} 대통령${id==='ljm'?' · 현직':''}</span>
      <div class="name" style="font-size:32px">${esc(P.name)} <small style="font-size:16px;color:var(--muted)">${esc(P.hanja)}</small></div>
      <dl class="info">
        <dt>임기</dt><dd>${esc(P.term)}</dd>
        <dt>출생</dt><dd>${esc(P.born)}</dd>
        <dt>정당</dt><dd>${esc(P.party)}</dd>
        <dt>별칭</dt><dd>${esc(P.nickname)}</dd>
      </dl>
      <div class="row"><button class="btn voice" data-voice="${id}">🔊 목소리로 듣기</button></div>
      <div class="bubble" id="bubble-${id}">${esc(P.narration)}</div>
      <h3>한눈에 보기</h3><p class="summary">${esc(P.summary)}</p>
      <h3>주요 발자취</h3><ul class="pix">${P.keyEvents.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>
      <h3>깨알 TMI</h3><ul class="pix">${P.trivia.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>
      <h3>시그니처 무브</h3><p class="summary">${esc(L.moveLabel)}</p>
    </div>
  </div>`;
}
const modal=document.getElementById('modal'), sheet=document.getElementById('sheet');
function openDetail(id){
  sheet.innerHTML=detail(id); modal.classList.add('open');
  loadPhoto(id, document.getElementById('photoBox'));
  sheet.querySelector('.close').focus();
}
function closeDetail(){modal.classList.remove('open'); stopVoice()}
document.addEventListener('click',e=>{
  const v=e.target.closest('.btn.voice'); if(v){e.stopPropagation(); speak(v.dataset.voice,v); return}
  if(e.target.closest('.close')||e.target===modal){closeDetail();return}
  const c=e.target.closest('.card'); if(c) openDetail(c.dataset.id);
  const t=e.target.closest('.tl'); if(t) openDetail(t.dataset.id);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeDetail();
  if(e.key==='Enter'&&e.target.classList.contains('card')) openDetail(e.target.dataset.id);
});
document.getElementById('grid').innerHTML=ORDER.map(card).join('');
document.getElementById('timeline').innerHTML=ORDER.filter(id=>DATA[id]).map(id=>`<div class="tl" data-id="${id}"><b>${esc(DATA[id].order)}</b>${esc(DATA[id].name)}<br>${esc(DATA[id].term)}</div>`).join('<div style="align-self:center;color:#ffd23f">▶</div>');
</script>
